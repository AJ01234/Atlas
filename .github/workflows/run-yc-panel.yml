name: Build YC panel and run hypothesis tests
on:
  push:
    paths:
      - 'analysis/build_yc_panel.py'
      - '.github/workflows/run-yc-panel.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy requests statsmodels
      - name: Build panel and test hypotheses
        run: python analysis/build_yc_panel.py
      - name: Commit generated panel and results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis_output
          git diff --cached --quiet || git commit -m 'Generate YC company panel and H1-H5 proxy results'
          git push
